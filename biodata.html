        <section id="form">
            <h2>Form Biodata</h2>
            <form>
                <label for="nama">Nama Mahasiswa : </label><br>
                <input type="text" id="nama" name="nama" placeholder="Input nama lengkap.." required><br><br>

                <label for="email">Email : </label><br>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

                <label for="password">Password : </label><br>
                <input type="password" id="password" name="password" placeholder="Input password.." required><br><br>

                <label for="gender">Jenis Kelamin : </label><br>
                <input type="radio" id="laki-laki" name="gender" value="laki-laki" required>
                <label for="laki-laki">Laki-laki</label>
                <input type="radio" id="perempuan" name="gender" value="perempuan" required>
                <label for="perempuan">Perempuan</label><br><br>

                <label for="prodi">Program Studi : </label><br>
                <select id="prodi" name="prodi" required>
                    <option value="">--Pilih Program Studi--</option>
                    <option value="TIK">Teknik Informatika</option>
                    <option value="SI">Sistem Informasi</option>
                    <option value="TIN">Teknik Industri</option>
                </select><br><br>

                <table>
                    <thead>
                        <tr>
                            <th colspan="2">Minat</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <input type="checkbox" id="web" name="minat" value="web"><label for="web">Web Development</label>
                            </td>
                            <td>

                            </td>
                        </tr>
                        <tr>
                            <td>

                            </td>
                            <td>
                                <input type="checkbox" id="ai" name="minat" value="ai"><label for="ai">Artificial Intelligence</label>
                            </td>
                        </tr>
                    </tbody>
                </table><br>
                
                <input type="submit" value="Submit">
